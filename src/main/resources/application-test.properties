spring.application.name=thuongmaidientu

# ---- Cơ sở dữ liệu (ghi đè bằng biến môi trường, xem .env.example) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/thuongmaidientu?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# Tự động tạo/cập nhật bảng dựa trên Java Model (production nên chuyển sang Flyway)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.defer-datasource-initialization=true

# ---- Bảo mật ----
# JWT_SECRET >= 32 ký tự. Bỏ trống: sinh khóa ngẫu nhiên mỗi lần chạy.
app.jwt.secret=${JWT_SECRET:}
# Đặt true khi chạy sau HTTPS
app.cookie.secure=${COOKIE_SECURE:false}
# Tài khoản mẫu do DataSeeder tạo ở lần chạy đầu tiên
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
app.seed.user-password=${USER_PASSWORD:123456}

# ---- Thanh toán chuyển khoản ----
# Secret webhook (SePay/Casso). Bỏ trống thì webhook bị TỪ CHỐI, trừ khi allow-unsigned=true (chỉ dev).
payment.webhook.secret=${PAYMENT_WEBHOOK_SECRET:}
payment.webhook.allow-unsigned=${PAYMENT_WEBHOOK_ALLOW_UNSIGNED:false}
payment.bank.id=${BANK_ID:VCB}
payment.bank.account-no=${BANK_ACCOUNT_NO:0123456789}
payment.bank.account-name=${BANK_ACCOUNT_NAME:SHOPMART JSC}
# Giữ hàng cho đơn chuyển khoản chưa thanh toán (phút), và chu kỳ quét (ms)
payment.hold-minutes=${PAYMENT_HOLD_MINUTES:15}
payment.expiry-check-ms=${PAYMENT_EXPIRY_CHECK_MS:60000}