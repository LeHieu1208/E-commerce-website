spring.application.name=thuongmaidientu
# Cấu hình kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/thuongmaidientu?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456

# Tự động tạo/cập nhật bảng dựa trên Java Model
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Chạy dữ liệu mẫu từ data.sql
spring.jpa.defer-datasource-initialization=true