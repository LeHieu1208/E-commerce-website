<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopmart - Sản phẩm</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --coral: #D85A30;
    --coral-light: #FAECE7;
    --coral-dark: #4A1B0C;
    --amber: #EF9F27;
    --text-primary: #1F1D1A;
    --text-secondary: #6B6862;
    --text-muted: #9B968D;
    --surface-0: #F7F5F1;
    --surface-1: #FFFFFF;
    --border: #E8E4DC;
    --border-strong: #D6D1C6;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--surface-0);
    color: var(--text-primary);
    line-height: 1.5;
  }
  header {
    background: var(--surface-1);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header a.logo { font-weight: 700; font-size: 20px; color: var(--coral); text-decoration: none; }
  header nav a { margin-left: 20px; color: var(--text-secondary); text-decoration: none; font-size: 14px; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px; }
  .search-box { display: flex; gap: 8px; margin-bottom: 24px; }
  .search-box input {
    flex: 1; padding: 10px 14px; border: 1px solid var(--border-strong);
    border-radius: var(--radius); font-size: 14px;
  }
  .search-box button {
    padding: 10px 18px; background: var(--coral); color: #fff; border: none;
    border-radius: var(--radius); cursor: pointer; font-weight: 600;
  }
  .page-title { font-size: 22px; margin-bottom: 20px; }
  .category-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.category-chip {
  padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border-strong);
  font-size: 13px; font-weight: 600; color: var(--text-secondary); background: var(--surface-1);
}
  .category-chip.active, .category-chip:hover { background: var(--coral); border-color: var(--coral); color: #fff; }

  .category-section { margin-bottom: 36px; }
  .category-section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid var(--border);
  }
  .category-section-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .category-section-title i { color: var(--coral); font-size: 18px; }
  .see-all { font-size: 13px; color: var(--coral); font-weight: 600; }
  .products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }
  .product-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .product-image {
    position: relative;
    height: 140px;
    background: var(--coral-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: var(--coral);
  }
  .product-tag {
    position: absolute; top: 8px; left: 8px;
    background: var(--amber); color: #fff; font-size: 11px;
    padding: 2px 8px; border-radius: 4px; font-weight: 600;
  }
  .product-info { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .product-name { font-size: 14px; font-weight: 600; min-height: 38px; }
  .product-price-row { display: flex; align-items: baseline; gap: 8px; }
  .price { color: var(--coral); font-weight: 700; }
  .price-old { color: var(--text-muted); font-size: 12px; text-decoration: line-through; }
  .product-rating { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
  .btn-add {
    margin-top: 6px; width: 100%; padding: 8px; border: none; border-radius: var(--radius);
    background: var(--coral-dark); color: #fff; cursor: pointer; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .empty-state { color: var(--text-muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <a th:href="@{/}" class="logo">Shopmart</a>
  <nav>
    <a th:href="@{/}">Trang chủ</a>
    <a th:href="@{/cart}">Giỏ hàng (<span th:text="${cartCount != null} ? ${cartCount} : 0">0</span>)</a>
  </nav>
</header>

<main>
  <form class="search-box" th:action="@{/products}" method="get">
    <input type="text" name="keyword" placeholder="Tìm sản phẩm..." th:value="${keyword}">
    <button type="submit">Tìm kiếm</button>
  </form>

  <h1 class="page-title">Danh sách sản phẩm</h1>

  <div class="category-filter">
    <a th:href="@{/products(keyword=${keyword})}" class="category-chip"
       th:classappend="${categoryId == null} ? 'active'">Tất cả</a>
    <a th:each="c : ${categories}"
       th:href="@{/products(categoryId=${c.id}, keyword=${keyword})}"
       class="category-chip"
       th:classappend="${categoryId != null and categoryId == c.id} ? 'active'"
       th:text="${c.name}">Tên danh mục</a>
  </div>

  <div class="category-section" th:if="${selectedCategory != null}">
    <div class="category-section-header">
      <h2 class="category-section-title">
        <i class="ti" th:classappend="${selectedCategory.icon}"></i>
        <span th:text="${selectedCategory.name}">Tên danh mục</span>
      </h2>
    </div>
  </div>

  <div class="products" th:if="${!#lists.isEmpty(products)}">
    <a class="product-card" th:each="p : ${products}" th:href="@{/products/{id}(id=${p.id})}" style="text-decoration:none;color:inherit;">
      <div class="product-image">
        <span class="product-tag" th:if="${p.discountPercent != null and p.discountPercent > 0}"
              th:text="'-' + ${p.discountPercent} + '%'"></span>
        <img th:if="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}"
             th:src="${p.imageUrl}"
             th:alt="${p.name}"
             style="width: 100%; height: 100%; object-fit: cover;" />
        <i th:unless="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}"
           class="ti"
           th:classappend="${p.icon != null ? p.icon : 'ti-package'}"></i>
      </div>
      <div class="product-info">
        <p class="product-name" th:text="${p.name}">Tên sản phẩm</p>
        <div class="product-price-row">
          <span class="price"
                th:text="${#numbers.formatDecimal((p.discountPercent != null && p.discountPercent > 0) ? p.discountedPrice : p.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span>
          <span class="price-old"
                th:if="${p.oldPrice != null || (p.discountPercent != null && p.discountPercent > 0)}"
                th:text="${#numbers.formatDecimal(p.oldPrice != null ? p.oldPrice : p.price, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
        </div>
        <div class="product-rating">
          <i class="ti ti-star"></i>
          <span th:if="${p.rating != null and p.reviewCount != null and p.reviewCount > 0}"
                th:text="${p.rating} + ' (' + ${p.reviewCount} + ')'">0 (0)</span>
          <span th:unless="${p.rating != null and p.reviewCount != null and p.reviewCount > 0}">Chưa có đánh giá</span>
        </div>
      </div>
    </a>
  </div>

  <p th:if="${#lists.isEmpty(products)}" class="empty-state">
    Không tìm thấy sản phẩm nào.
  </p>
</main>

</body>
</html>
