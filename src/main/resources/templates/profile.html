<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân - Shopmart</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f7f5f1; color: #1f1d1a; margin: 0; }
        .container { max-width: 700px; margin: 40px auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
        h1 { margin-bottom: 16px; }
        .field { margin-bottom: 14px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        button { background: #d85a30; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
        .msg { margin-top: 14px; color: #d85a30; }
    </style>
</head>
<body>
<div class="container">
    <h1>Thông tin cá nhân</h1>
    <form th:action="@{/profile}" method="post" th:object="${user}">
        <div class="field">
            <label>Họ tên</label>
            <input type="text" th:field="*{fullName}" required>
        </div>
        <div class="field">
            <label>Email</label>
            <input type="email" th:field="*{email}" readonly>
        </div>
        <div class="field">
            <label>Số điện thoại</label>
            <input type="text" th:field="*{phone}">
        </div>
        <div class="field">
            <label>Địa chỉ</label>
            <input type="text" th:field="*{address}">
        </div>
        <button type="submit">Lưu thông tin</button>
    </form>
    <div class="msg" th:if="${message}" th:text="${message}"></div>
    <p style="margin-top: 14px;"><a href="/">Quay về trang chủ</a></p>
</div>
</body>
</html>
